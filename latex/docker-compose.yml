services:
  latex:
    image: texlive/texlive:latest
    user: "1000:1000"
    userns_mode: keep-id
    working_dir: /work
    volumes:
      - .:/work:Z
    entrypoint: ["/bin/bash"]
    command:
      - -lc
      - >-
        set -e;
        TEXLIVE_BIN="$$(find /usr/local/texlive -type d -name x86_64-linux -print -quit)";
        test -n "$$TEXLIVE_BIN";
        export PATH="$$TEXLIVE_BIN:$$PATH";
        command -v xelatex;
        xelatex -halt-on-error -interaction=nonstopmode main.tex;
        makeglossaries main;
        bibtex main || test -s main.bbl;
        xelatex -halt-on-error -interaction=nonstopmode main.tex;
        xelatex -halt-on-error -interaction=nonstopmode main.tex;
        test -s main.pdf;
        echo "PDF gerado: main.pdf"

  clean:
    image: texlive/texlive:latest
    user: "1000:1000"
    userns_mode: keep-id
    working_dir: /work
    volumes:
      - .:/work:Z
    entrypoint: ["/bin/bash"]
    command:
      - -lc
      - >-
        find . -type f \(
        -name '*.aux' -o -name '*.bbl' -o -name '*.bcf' -o -name '*.blg'
        -o -name '*.fdb_latexmk' -o -name '*.fls' -o -name '*.glo'
        -o -name '*.glg' -o -name '*.gls' -o -name '*.idx' -o -name '*.ilg'
        -o -name '*.ind' -o -name '*.ist' -o -name '*.lof' -o -name '*.log'
        -o -name '*.lot' -o -name '*.out' -o -name '*.run.xml'
        -o -name '*.toc' -o -name '*.acn' -o -name '*.acr' -o -name '*.alg'
        \) -delete